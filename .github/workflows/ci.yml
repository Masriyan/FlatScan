name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed vulnerabilities surface without a push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

defaults:
  run:
    # The Go module lives in a directory with a space in its name.
    working-directory: "source go"

jobs:
  test:
    # FlatScan claims to build and run on Linux, macOS and Windows, and ships a
    # Linux-only mmap path with a fallback for the others (mmap_linux.go /
    # mmap_other.go). Testing only on Linux left the fallback and every
    # path-handling difference unexercised, so the portability claim was
    # unverified. The matrix is what makes it checkable.
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "source go/go.mod"
          cache-dependency-path: "source go/go.sum"

      # gofmt and vet are platform-independent, so running them on every OS
      # would just triplicate the same failure. Linux is the canonical check.
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

  cross-compile:
    # Catches a build break on a target the test matrix does not run, notably
    # the arm64 variants used for Apple Silicon and ARM servers.
    name: Cross-compile targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "source go/go.mod"
          cache-dependency-path: "source go/go.sum"
      - name: Build every released target
        run: |
          set -e
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "::group::$target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null .
            echo "::endgroup::"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "source go/go.mod"
          cache-dependency-path: "source go/go.sum"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: "source go"

  vulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "source go/go.mod"
          cache-dependency-path: "source go/go.sum"
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: "source go/go.mod"
          cache-dependency-path: "source go/go.sum"
      # A short run per target on every PR catches regressions against the
      # committed seed corpus. Long campaigns belong in a scheduled job.
      - name: Run each fuzz target briefly
        run: |
          targets=$(go test -list '^Fuzz' ./... | grep '^Fuzz' || true)
          if [ -z "$targets" ]; then
            echo "No fuzz targets yet — skipping."
            exit 0
          fi
          for t in $targets; do
            echo "::group::$t"
            go test -run "^$" -fuzz "^$t$" -fuzztime 45s ./...
            echo "::endgroup::"
          done
